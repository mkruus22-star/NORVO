p{color:var(--mist);margin:0 0 6px;line-height:1.6}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a.btn{display:inline-block;padding:13px 22px;background:var(--ral);color:var(--paper);text-decoration:none;font-weight:600;font-size:.9rem}
a.btn.ghost{background:none;color:var(--ral);border:1px solid var(--ral)}
</style>

  <img src="/img/icons/favicon.svg" alt="NORVO">
